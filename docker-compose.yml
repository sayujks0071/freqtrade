services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade_delta
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Secrets from .env or shell
      - FREQTRADE__EXCHANGE__KEY=${DELTA_API_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${DELTA_API_SECRET}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_API_PASSWORD}

      # Base URL overrides (calculated by scripts/common.sh)
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__public=${FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__public}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__private=${FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__private}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__www=${FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__www}

    # Default command uses dryrun config unless overridden
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/configs/${FREQTRADE_CONFIG_FILE:-config.delta.dryrun.json}
      --strategy SampleStrategy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
