---
version: '3'
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./tools:/freqtrade/tools"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - FREQTRADE__EXCHANGE__KEY=${DELTA_API_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${DELTA_API_SECRET}
      # CCXT Overrides for Delta Environment
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__public=${DELTA_BASE_URL}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__private=${DELTA_BASE_URL}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__www=${DELTA_BASE_URL}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__doc=${DELTA_BASE_URL}
      # Custom Env Vars for Scripts
      - DELTA_ENV=${DELTA_ENV:-india_testnet}
      - MIN_MARKETS=${MIN_MARKETS:-20}
      - MAX_REMOVAL_RATIO=${MAX_REMOVAL_RATIO:-0.25}
      - STRICT_VOLUME=${STRICT_VOLUME:-false}
      - FILTER_MODE=${FILTER_MODE:-perps_usdt}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Default to dry-run with the dynamic whitelist and JSON logging
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --log-format json
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/configs/config.delta.dryrun.json
      --config /freqtrade/user_data/pairlists/whitelist.delta.json
      --strategy DeltaSafeStrategy
