version: '3'
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
      # Mount tools for validation and reporting inside container if needed
      - "./tools:/freqtrade/tools"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Pass Delta credentials and config via env vars
      - FREQTRADE__EXCHANGE__KEY=${DELTA_API_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${DELTA_API_SECRET}
      # Map host vars to internal vars for custom scripts
      - DELTA_ENV=${DELTA_ENV:-india_testnet}
      - DELTA_BASE_URL=${DELTA_BASE_URL:-}
      - MIN_MARKETS=${MIN_MARKETS:-20}
      - MAX_REMOVAL_RATIO=${MAX_REMOVAL_RATIO:-0.25}
      - STRICT_VOLUME=${STRICT_VOLUME:-false}
      - FILTER_MODE=${FILTER_MODE:-perps_usdt}
      - ALLOWLIST_REGEX=${ALLOWLIST_REGEX:-.*USDT:USDT}
      # CCXT generic overrides if needed (empty by default)
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__public
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__private
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__www
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --log-format json
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/configs/${FREQTRADE_CONFIG_FILE:-config.delta.dryrun.json}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ping || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
