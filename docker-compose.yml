---
version: '3'
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - FREQTRADE_CONFIG_FILE=${FREQTRADE_CONFIG_FILE:-config.delta.dryrun.json}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE__EXCHANGE__KEY}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE__EXCHANGE__SECRET}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__PUBLIC=${FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__PUBLIC}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__PRIVATE=${FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__PRIVATE}
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__WWW=${FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__WWW}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.json
      --log-format json
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/configs/${FREQTRADE_CONFIG_FILE:-config.delta.dryrun.json}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ping || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
