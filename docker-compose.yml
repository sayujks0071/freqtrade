---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DELTA_API_KEY
      - DELTA_API_SECRET
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__PUBLIC
      - FREQTRADE__EXCHANGE__CCXT_CONFIG__URLS__API__PRIVATE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config ${FREQTRADE_CONFIG:-/freqtrade/user_data/configs/config.delta.dryrun.json}
      --strategy SampleStrategy
