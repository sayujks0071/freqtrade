name: Weekly Strategy Report

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 0  # Full history for git log
          persist-credentials: true # Allow pushing back

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5.1.0
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Weekly Report
        run: |
          python scripts/weekly_report.py

      - name: Commit and Push Report
        run: |
          # Check if report changed
          if [[ -n $(git status --porcelain WEEKLY_REPORT.md) ]]; then
            git add WEEKLY_REPORT.md
            git commit -m "docs: generate weekly strategy report [skip ci]"
            git push
          else
            echo "No changes to report."
          fi
