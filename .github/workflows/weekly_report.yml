name: Weekly Strategy Report

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history for git log
          persist-credentials: true # Allow pushing back

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea870f5cd8841916fe8a92e6729732 # v5.3.0
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Weekly Report
        run: |
          python scripts/weekly_report.py

      - name: Commit and Push Report
        run: |
          # Check if report changed
          if [[ -n $(git status --porcelain WEEKLY_REPORT.md) ]]; then
            git add WEEKLY_REPORT.md
            git commit -m "docs: generate weekly strategy report [skip ci]"
            git push
          else
            echo "No changes to report."
          fi
