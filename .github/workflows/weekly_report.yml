name: Weekly Optimization Report

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 0 # Needed for git log
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5.1.0
        with:
          python-version: '3.10'

      - name: Generate Report
        run: |
          python3 scripts/generate_weekly_report.py
          cat WEEKLY_REPORT.md

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Configure remote with token because persist-credentials is false
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          git add WEEKLY_REPORT.md

          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "docs: update weekly optimization report"

            # Pull latest changes to avoid conflicts with daily optimization
            git pull --rebase origin main

            git push origin HEAD:main
          else
            echo "No changes to report."
          fi
