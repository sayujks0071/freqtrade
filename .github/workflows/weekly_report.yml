name: Weekly Optimization Report

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:  # Allow manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the report

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0  # Fetch all history for git log analysis

    - name: Set up Python
      uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.3.0
      with:
        python-version: '3.12'

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Generate Weekly Report
      # Note: optimization_log.txt must be present in the repo for "Stuck Strategies" analysis.
      # If daily_optimize.py runs in a different environment, ensure logs are synchronized.
      run: python scripts/generate_weekly_report.py
