name: Weekly Optimization Report

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Needed for git log

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea8a5f8963ad80ce717ecd7df4139f # v5.3.0
        with:
          python-version: '3.10'

      - name: Generate Report
        run: |
          python3 scripts/generate_weekly_report.py
          cat WEEKLY_REPORT.md

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add WEEKLY_REPORT.md

          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "docs: update weekly optimization report"
            git push origin HEAD:main
          else
            echo "No changes to report."
          fi
