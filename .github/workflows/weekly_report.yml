name: Weekly Strategy Report

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing changes

    steps:
    - name: Checkout repository
      # Using v4 (latest stable at time of writing) to avoid confusion with v6 which might be a pre-release or specific to a fork,
      # although existing workflows use v6 tags. To be safe and standard, I'll stick to widely known stable versions or the project's convention.
      # The project uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # I will use the same SHA as in ci.yml to be consistent.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0  # Fetch full history for git log analysis
        persist-credentials: true # Explicitly allow credential persistence for git push

    - name: Set up Python
      # The project uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      # I will use the same SHA as in ci.yml to be consistent.
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: '3.10'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Generate and Push Weekly Report
      # The script handles git add, commit, push internally if --push is provided.
      # It also requires optimization_log.txt which might be missing in a fresh checkout
      # unless it's tracked or generated by another job.
      # Assuming it's tracked or the user ensures it's available.
      # If not found, the script will skip that part but still generate the report based on git log.
      run: |
        python3 scripts/generate_weekly_report.py --push
