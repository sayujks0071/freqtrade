name: Regime Switcher

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  regime-switch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas ccxt ft-pandas-ta

      - name: Run Regime Switcher
        run: python scripts/regime_switcher.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "RegimeSwitcherBot"
          git config --global user.email "regimeswitcher@freqtrade.io"
          git add user_data/configs/config_production.json regime_log.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update regime and strategy [skip ci]" && git push)
