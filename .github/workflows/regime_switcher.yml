name: Regime Switcher

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch_regime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install TA-Lib
        run: |
          wget https://downloads.sourceforge.net/project/ta-lib/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Re-install ta-lib python wrapper to ensure it links against the installed C lib
          pip install --force-reinstall --no-cache-dir ta-lib

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Set up authentication for push using the token provided by checkout action (implicitly)
          # Actually, checkout persists-credentials: false means we need to set it up or use a PAT?
          # daily_optimize.yml uses persist-credentials: false but then runs a python script that does git operations.
          # The daily_optimize.py script likely uses local git config.
          # If persist-credentials is false, we need a token to push.
          # But usually GITHUB_TOKEN is sufficient if permissions are set.
          # Let's check how daily_optimize does it. It seems to rely on the environment or the script handles it.
          # Wait, daily_optimize.yml does NOT set up remote url with token.
          # Ah, maybe I should set persist-credentials: true?
          # Or follow the pattern. daily_optimize.yml uses 'persist-credentials: false'.
          # Let's use 'persist-credentials: true' to be safe for a shell script push,
          # or manually set the remote.
          # But 'daily_optimize.py' might just be committing locally and relying on a separate push?
          # No, the comments say "auto-commit/push".
          # It's safer to use 'persist-credentials: true' if I want to push from the shell step.
          # However, zizmor might complain about long lived credentials if not careful.
          # I'll use 'persist-credentials: true' and the default token.

      - name: Run Regime Switcher
        run: |
          python scripts/regime_switcher.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add user_data/config_production.json regime_log.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update regime strategy [skip ci]"
            # Pull before push to avoid conflicts
            git pull --rebase
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
