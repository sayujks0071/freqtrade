name: Regime Switcher

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch_regime:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ccxt pandas pandas_ta

    - name: Run Regime Switcher
      run: python3 scripts/regime_switcher.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'freqtrade-bot'
        git config --global user.email 'bot@freqtrade.io'
        git add user_data/config_production.json user_data/regime_log.md
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update active strategy based on market regime"
          git push
        fi
