name: Regime Switcher

on:
  schedule:
    # Run at 00:00 UTC every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-regime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.4.0
        uses: actions/setup-python@39cd14951b08e74f54015e9e001cdefcf80e669f
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas-ta ccxt

      - name: Run Regime Switcher
        run: |
          python3 scripts/regime_switcher.py

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check for changes
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected. Committing..."
            # Force add if ignored
            git add -f user_data/config_production.json regime_log.md
            git commit -m "chore: update strategy based on market regime"

            # Configure remote with token for push since persist-credentials is false
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"

            # Push to the current branch (HEAD -> current ref) using environment variable for ref name
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          else
            echo "No changes detected."
          fi
