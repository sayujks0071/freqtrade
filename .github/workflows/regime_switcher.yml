name: Regime Switcher

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

jobs:
  regime-switch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas ccxt "ta-lib>=0.6.8"

    - name: Run Regime Switcher
      run: python3 scripts/regime_switcher.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add user_data/configs/config_production.json regime_log.md
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: update strategy based on regime detection [skip ci]"
          git push
        fi
