name: Regime Switcher

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regime-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ccxt pandas pandas_ta

      - name: Run Regime Switcher
        run: python3 scripts/regime_switcher.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add user_data/configs/config_production.json regime_log.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update strategy based on regime analysis"
            # Explicitly set remote url for persist-credentials: false
            remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git remote set-url origin $remote_repo
            git push origin HEAD:main
          fi
