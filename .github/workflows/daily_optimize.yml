name: Daily Optimization

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install freqtrade

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Daily Optimization
        run: |
          # Ensure we have data for the backtest
          # Assuming data exists or script handles downloading.
          # The script runs freqtrade backtesting, which needs data.
          # Freqtrade usually downloads data if not present? No, download-data command is needed.

          # We'll run download-data first to be safe, for the last 30 days.
          freqtrade download-data --config user_data/configs/config_daily_opt.json --days 30 -t 1h

          python3 scripts/daily_optimize.py --yes --branch main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
