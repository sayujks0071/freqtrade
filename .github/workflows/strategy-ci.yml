name: Strategy CI

on:
  push:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  pull_request:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Syntax Check (Compile)
        run: |
          python -m compileall user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          python tools/strategy_auditor.py user_data/strategies/
