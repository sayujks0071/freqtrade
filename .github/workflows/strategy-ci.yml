name: Strategy CI

on:
  pull_request:
    paths:
      - 'user_data/strategies/**/*.py'
  push:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**/*.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Syntax Check
      run: |
        find user_data/strategies -name "*.py" -print0 | xargs -0 python3 -m py_compile

    - name: Run Auditor
      run: |
        failed=0
        for strat in $(find user_data/strategies -name "*.py" | grep -v "__init__" | grep -v "_base"); do
           echo "Auditing $strat..."
           python3 tools/strategy_auditor.py "$strat" || failed=1
        done
        if [ $failed -ne 0 ]; then
          echo "Strategy Audit Failed!"
          exit 1
        fi
