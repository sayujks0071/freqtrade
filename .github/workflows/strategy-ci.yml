name: Strategy CI

on:
  push:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  pull_request:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

permissions:
  contents: read

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.10'

      - name: Compile Check
        run: |
          # Basic syntax check
          python3 -m compileall user_data/strategies/

      - name: Strategy Auditor
        run: |
          chmod +x tools/strategy_auditor.py
          python3 tools/strategy_auditor.py user_data/strategies/
