name: Strategy CI

on:
  pull_request:
    paths:
      - 'user_data/strategies/**'
  push:
    branches:
      - main
    paths:
      - 'user_data/strategies/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318eca12b30c52014ac82a88e6d # v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests
          # Install minimal dependencies for linting

      - name: Compile Check
        run: |
          python3 -m compileall user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          python3 tools/strategy_auditor.py user_data/strategies/

      - name: Safety Heuristics
        run: |
          # Check for forbidden patterns not caught by AST (e.g. dynamic imports if any)
          if grep -r "exec(" user_data/strategies/; then
            echo "Forbidden exec() usage found"
            exit 1
          fi
          if grep -r "eval(" user_data/strategies/; then
            echo "Forbidden eval() usage found"
            exit 1
          fi
