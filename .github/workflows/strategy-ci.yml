name: Strategy CI

on:
  push:
    paths:
      - 'user_data/strategies/**'
  pull_request:
    paths:
      - 'user_data/strategies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v4.8.0
        with:
          python-version: '3.10'

      - name: Syntax Check (compileall)
        run: |
          # Checks for syntax errors
          python3 -m compileall user_data/strategies

      - name: Run Strategy Auditor
        run: |
          chmod +x tools/strategy_auditor.py

          echo "Auditing strategies..."
          # Run on all strategies
          python3 tools/strategy_auditor.py user_data/strategies/
