name: Strategy CI

on:
  push:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**/*.py'
      - 'tools/strategy_auditor.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**/*.py'
      - 'tools/strategy_auditor.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@82c7e6d818d7158f1f465d0a6c221c00c7e2b740 # v5.0.0
        with:
          python-version: '3.11'

      - name: Syntax Check (compileall)
        run: |
          python3 -m compileall user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          # Find all strategy files (excluding __init__.py and _base)
          # Auditing all .py files in strategies/ recursively
          find user_data/strategies/ -name "*.py" -not -path "*/_base/*" -not -name "__init__.py" > strategies_list.txt

          if [ -s strategies_list.txt ]; then
              python3 tools/strategy_auditor.py $(cat strategies_list.txt)
          else
              echo "No strategies found to audit."
          fi
