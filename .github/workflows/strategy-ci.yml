name: Strategy CI

on:
  pull_request:
    paths:
      - 'user_data/strategies/**.py'
      - 'tools/strategy_auditor.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install pandas numpy ccxt tabulate requests

    - name: Syntax Check (compileall)
      run: |
        python -m compileall user_data/strategies/

    - name: Run Strategy Auditor
      run: |
        # Run auditor on all modified or new strategy files
        # We can find modified files using git diff
        # But for simplicity, we audit ALL strategies in user_data/strategies (excluding vendor if desired)

        # We need to exclude _base and vendor?
        # Let's audit everything in user_data/strategies/*.py

        python tools/strategy_auditor.py user_data/strategies/*.py

    - name: Report Status
      if: failure()
      run: |
        echo "::error::Strategy Audit Failed! Please fix the issues listed above."
        exit 1
