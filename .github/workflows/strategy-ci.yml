name: Strategy CI

on:
  push:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  pull_request:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Check
        run: |
          # Basic syntax check
          python3 -m compileall user_data/strategies/

      - name: Strategy Auditor
        run: |
          chmod +x tools/strategy_auditor.py
          python3 tools/strategy_auditor.py user_data/strategies/
