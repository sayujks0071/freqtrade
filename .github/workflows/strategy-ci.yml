name: Strategy CI

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  push:
    branches: [ main, master ]
    paths:
      - 'user_data/strategies/**'

permissions:
  contents: read

jobs:
  audit_strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Compile Check
        run: |
          # Freqtrade imports will fail without installation, but syntax check should pass
          python3 -m compileall -q user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          # Audit the strategies folder
          python3 tools/strategy_auditor.py user_data/strategies/
