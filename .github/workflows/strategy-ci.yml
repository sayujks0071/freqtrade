name: Strategy CI

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

jobs:
  audit_strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Compile Check
        run: |
          python3 -m compileall user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          # Audit the strategies folder
          python3 tools/strategy_auditor.py user_data/strategies/
