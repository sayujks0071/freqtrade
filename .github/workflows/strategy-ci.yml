name: Strategy CI

on:
  push:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**'
  pull_request:
    paths:
      - 'user_data/strategies/**'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea870f0663e4109b9cc1c54a01502b # v5.3.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Minimal dependencies for AST check (pandas/numpy might be needed if auditor imports them via strategy execution? No, auditor uses AST)
        # But compileall might fail if imports are missing? No, compileall just checks syntax.
        # But if we want to run tests or static analysis that imports, we need deps.
        # tools/strategy_auditor.py only uses `ast` which is stdlib.
        # But let's install minimal just in case.
        # We don't need freqtrade installed for AST check.

    - name: Syntax Check
      run: |
        python -m compileall user_data/strategies/

    - name: Audit Strategies
      run: |
        python tools/strategy_auditor.py user_data/strategies/
