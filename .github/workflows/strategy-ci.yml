name: Strategy CI

on:
  pull_request:
    paths:
      - 'user_data/strategies/**'
  workflow_dispatch:

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Check
        run: |
          python -m compileall user_data/strategies/
          if [ $? -ne 0 ]; then
            echo "::error::Python compilation failed."
            exit 1
          fi

      - name: Run Strategy Auditor
        run: |
          python tools/strategy_auditor.py user_data/strategies/
          if [ $? -ne 0 ]; then
            echo "::error::Strategy Audit Failed. Please fix errors or run with --fix locally."
            exit 1
          fi

      - name: Safety Heuristics (Grep)
        run: |
          # Additional simple grep checks
          if grep -r "requests\." user_data/strategies/ --include="*.py" | grep -v "tools/"; then
             echo "::error::Found usage of 'requests' in strategies. Forbidden."
             exit 1
          fi
          if grep -r "import os" user_data/strategies/ --include="*.py" | grep -v "_base"; then
             echo "::warning::Found usage of 'import os'. Please ensure it's safe."
          fi

      - name: Post Summary
        if: failure()
        run: |
          echo "### Strategy CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please review the audit logs above." >> $GITHUB_STEP_SUMMARY
