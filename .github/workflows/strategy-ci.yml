name: Strategy CI

on:
  push:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  pull_request:
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Syntax Check (Compile)
        run: |
          python -m compileall user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          python tools/strategy_auditor.py user_data/strategies/
