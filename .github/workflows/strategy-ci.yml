name: Strategy CI

on:
  push:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Audit Strategies
        run: |
          chmod +x tools/strategy_auditor.py
          python3 tools/strategy_auditor.py user_data/strategies/

      - name: Syntax Check
        run: |
          # Compile all python files to check for syntax errors
          python3 -m compileall user_data/strategies/
