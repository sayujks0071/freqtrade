name: Strategy CI

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

permissions:
  contents: read

jobs:
  audit_strategies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Compile Check
        run: |
          python3 -m compileall user_data/strategies/

      - name: Run Strategy Auditor
        run: |
          # Audit the strategies folder
          # Exclude _base is handled by the tool
          python3 tools/strategy_auditor.py user_data/strategies/
