name: Strategy CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  audit-strategies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea875859605c3320074366ed05652a # v5.3.0
        with:
          python-version: '3.10'

      - name: Compile Check
        run: python3 -m compileall user_data/strategies/

      - name: Audit Strategies
        run: |
          # Find all python files in strategies folder, excluding __init__.py and _base
          find user_data/strategies -name "*.py" -not -path "*/_base/*" -not -name "__init__.py" | while read file; do
            echo "Auditing $file..."
            python3 tools/strategy_auditor.py --file "$file" || exit 1
          done
