name: Strategy CI

on:
  push:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'user_data/strategies/**'
      - 'tools/strategy_auditor.py'

jobs:
  audit:
    runs_on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Compile Python Files
      run: |
        python -m compileall user_data/strategies/

    - name: Run Strategy Auditor
      run: |
        python tools/strategy_auditor.py user_data/strategies/
