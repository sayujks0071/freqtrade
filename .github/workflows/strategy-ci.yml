name: Strategy CI

on:
  push:
    paths:
      - 'user_data/strategies/**.py'
  pull_request:
    paths:
      - 'user_data/strategies/**.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Strategy Auditor
      run: |
        python3 tools/strategy_auditor.py user_data/strategies/

    - name: Syntax Check
      run: |
        python3 -m compileall user_data/strategies/
