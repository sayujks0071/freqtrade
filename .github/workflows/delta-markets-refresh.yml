name: Delta Markets Refresh

on:
  schedule:
    # 06:30 Asia/Kolkata is 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      FILTER_MODE:
        description: 'Filter Mode'
        required: true
        default: 'perps_usdt'
        type: choice
        options:
        - perps_usdt
        - all_futures
        - allowlist_regex

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests
          # Install freqtrade if needed?
          # We use docker compose in the script, so we need docker.
          # GitHub actions usually have docker.

      - name: Pull Docker Image
        run: docker compose pull freqtrade

      - name: Run Market Update
        env:
          DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
          FILTER_MODE: ${{ inputs.FILTER_MODE || 'perps_usdt' }}
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          # Use secrets for other vars if needed
          MIN_MARKETS: 20
          MAX_REMOVAL_RATIO: 0.25
        run: |
          # Create dummy config if needed or ensure vars are picked up
          # The script uses docker compose run which needs the .env file or env vars passed
          # We'll create a .env file from secrets
          echo "DELTA_ENV=$DELTA_ENV" > .env
          echo "DELTA_API_KEY=$DELTA_API_KEY" >> .env
          echo "DELTA_API_SECRET=$DELTA_API_SECRET" >> .env
          echo "FILTER_MODE=$FILTER_MODE" >> .env

          # Run script
          bash scripts/update_markets_and_whitelist.sh

      - name: Archive Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-reports
          path: user_data/reports/

      - name: Check for Changes
        id: git-check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add user_data/pairlists/
          git add user_data/reports/whitelist_diff_*.md
          # Check if anything is staged
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update delta markets and whitelist"
          title: "chore: Delta Markets Refresh $(date +'%Y-%m-%d')"
          body: |
            Automated market refresh.

            - Environment: ${{ inputs.DELTA_ENV || 'india_prod' }}
            - Filter: ${{ inputs.FILTER_MODE || 'perps_usdt' }}

            See artifacts for detailed drift report.
          branch: "chore/delta-markets-$(date +'%Y-%m-%d')"
          base: main
          delete-branch: true
