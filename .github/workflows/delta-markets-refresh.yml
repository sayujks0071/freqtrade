name: Delta Markets Refresh

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC = 07:00 IST (approx 06:30 IST)
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      FILTER_MODE:
        description: 'Filter Mode'
        required: false
        default: 'perps_usdt'

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@61a6322f88396a6271a6ee3565807d608ec43ef9 # v4.5.0
        with:
          python-version: '3.11'

      - name: Create .env file
        env:
          DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        run: |
          touch .env
          echo "DELTA_ENV=${DELTA_ENV}" >> .env
          echo "DELTA_API_KEY=${DELTA_API_KEY}" >> .env
          echo "DELTA_API_SECRET=${DELTA_API_SECRET}" >> .env
          # Add default settings to .env if not present
          echo "MIN_MARKETS=20" >> .env
          echo "MAX_REMOVAL_RATIO=0.25" >> .env

      - name: Run Update Script
        env:
          DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
          FILTER_MODE: ${{ inputs.FILTER_MODE || 'perps_usdt' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/update_markets_and_whitelist.sh

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update delta markets and whitelist"
          title: "chore: Update Delta Markets and Whitelist"
          body: |
            Update markets and whitelist for Delta Exchange.
            Environment: ${{ env.DELTA_ENV }}
            Filter Mode: ${{ env.FILTER_MODE }}

            Automated by Delta Markets Refresh workflow.
          branch: chore/delta-markets-refresh
          base: main
          delete-branch: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: market-reports
          path: user_data/reports/
