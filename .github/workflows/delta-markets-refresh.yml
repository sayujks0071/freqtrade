name: Delta Markets Refresh

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 06:30 IST
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
          - india_prod
          - global_prod
          - india_testnet
      FILTER_MODE:
        description: 'Filter Mode'
        required: true
        default: 'perps_usdt'
        type: choice
        options:
          - perps_usdt
          - all_futures
          - allowlist_regex

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install ccxt requests pandas

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Update Markets & Whitelist
        env:
          DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
          FILTER_MODE: ${{ inputs.FILTER_MODE || 'perps_usdt' }}
          MIN_MARKETS: 20
          MAX_REMOVAL_RATIO: 0.25
        run: bash scripts/update_markets_and_whitelist.sh

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: markets-reports
          path: user_data/reports/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5b4a9f6a9e2af523033904bc8e45888470b05cc9 # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update delta markets"
          branch: chore/delta-markets-refresh
          title: "chore: Daily Markets Refresh"
          body: |
            Daily update of markets and whitelist for Delta Exchange.
            Environment: ${{ inputs.DELTA_ENV || 'india_prod' }}

            Check the attached reports for details.
          base: main
