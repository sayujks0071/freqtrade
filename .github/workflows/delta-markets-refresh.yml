name: Delta Markets Refresh

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      FILTER_MODE:
        description: 'Whitelist Filter Mode'
        required: false
        default: 'perps_usdt'

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v5.1.0
        with:
          python-version: '3.11'

      - name: Create .env
        env:
          DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
          FILTER_MODE: ${{ inputs.FILTER_MODE || 'perps_usdt' }}
        run: |
          cp .env.example .env
          echo "DELTA_ENV=$DELTA_ENV" >> .env
          echo "FILTER_MODE=$FILTER_MODE" >> .env
          # Secrets
          if [ -n "${{ secrets.DELTA_API_KEY }}" ]; then
            echo "DELTA_API_KEY=${{ secrets.DELTA_API_KEY }}" >> .env
            echo "DELTA_API_SECRET=${{ secrets.DELTA_API_SECRET }}" >> .env
            echo "DELTA_BASE_URL=${{ secrets.DELTA_BASE_URL }}" >> .env
          else
            echo "WARNING: DELTA_API_KEY not set in secrets. Using dummy for dry-run if possible."
          fi

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Run Market Refresh
        run: ./scripts/update_markets_and_whitelist.sh
        env:
          PYTHONPATH: .

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: market-reports
          path: |
            user_data/reports/markets_*.json
            user_data/reports/whitelist_diff_*.md
            user_data/reports/markets_schema_report_*.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5e914681df9dc8120e6bf369b609f108f1e63869 # v7.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update markets and whitelist"
          title: "chore: Update Delta Markets and Whitelist"
          body: |
            Automated market refresh.

            Check artifacts for detailed reports.
          branch: chore/delta-markets-refresh
          base: main
          delete-branch: true
          add-paths: |
            user_data/pairlists/whitelist.delta.json
            user_data/reports/whitelist_diff_*.md
