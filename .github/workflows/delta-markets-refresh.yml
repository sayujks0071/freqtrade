name: Delta Markets Refresh

on:
  schedule:
    # 06:30 Asia/Kolkata is 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      FILTER_MODE:
        description: 'Whitelist Filter Mode'
        required: false
        default: 'perps_usdt'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set Environment Variables
      run: |
        echo "DELTA_ENV=${{ inputs.DELTA_ENV || 'india_prod' }}" >> $GITHUB_ENV
        echo "FILTER_MODE=${{ inputs.FILTER_MODE || 'perps_usdt' }}" >> $GITHUB_ENV
        echo "MIN_MARKETS=20" >> $GITHUB_ENV
        echo "MAX_REMOVAL_RATIO=0.25" >> $GITHUB_ENV
        echo "STRICT_VOLUME=false" >> $GITHUB_ENV

    - name: Create .env
      run: |
        cp .env.example .env

    - name: Run Update Script
      env:
        DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
        DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
      run: |
        chmod +x scripts/*.sh
        ./scripts/update_markets_and_whitelist.sh

    - name: Check for Changes
      id: git-check
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        if git diff --exit-code user_data/pairlists/; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and Create PR
      if: steps.git-check.outputs.changes == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME="chore/delta-markets-$(date +'%Y-%m-%d')"
        git checkout -b $BRANCH_NAME
        git add user_data/pairlists/ user_data/reports/
        git commit -m "chore: update delta markets $(date +'%Y-%m-%d')"
        git push origin $BRANCH_NAME
        # gh pr create --title "Update Delta Markets" --body "Automated update."

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: market-reports
        path: user_data/reports/
