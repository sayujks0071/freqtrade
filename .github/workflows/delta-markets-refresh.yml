name: Delta Markets Refresh

on:
  schedule:
    # 06:30 IST = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      FILTER_MODE:
        description: 'Whitelist Filter Mode'
        required: false
        default: 'perps_usdt'
        type: choice
        options:
        - perps_usdt
        - all_futures
        - allowlist_regex

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Tools
      run: |
        docker pull freqtradeorg/freqtrade:stable

    - name: Bootstrap
      run: ./scripts/bootstrap.sh

    - name: Refresh Markets and Whitelist
      env:
        DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
        FILTER_MODE: ${{ inputs.FILTER_MODE || 'perps_usdt' }}
        MIN_MARKETS: 20
        MAX_REMOVAL_RATIO: 0.25
        STRICT_VOLUME: false
      run: |
        ./scripts/update_markets_and_whitelist.sh

    - name: Check for changes
      id: git-check
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        if [ -n "$(git status --porcelain user_data/pairlists/)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.git-check.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update delta whitelist for ${{ inputs.DELTA_ENV || 'india_prod' }}"
        title: "chore: update delta whitelist ${{ inputs.DELTA_ENV || 'india_prod' }}"
        body: |
          Automated market refresh.
          Environment: ${{ inputs.DELTA_ENV || 'india_prod' }}
          Date: $(date)
        branch: "chore/delta-markets-refresh"
        base: main
        delete-branch: true

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: market-reports
        path: user_data/reports/
