name: Delta Markets Refresh

on:
  schedule:
    # 06:30 IST is 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment (india_prod, global_prod, india_testnet)'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      FILTER_MODE:
        description: 'Whitelist Filter Mode'
        required: true
        default: 'perps_usdt'
        type: choice
        options:
        - perps_usdt
        - all_futures
        - allowlist_regex

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set Environment Variables
        run: |
          echo "DELTA_ENV=${{ github.event.inputs.DELTA_ENV || 'india_prod' }}" >> $GITHUB_ENV
          echo "FILTER_MODE=${{ github.event.inputs.FILTER_MODE || 'perps_usdt' }}" >> $GITHUB_ENV
          # Set API Base URL based on ENV (simplified logic or rely on script defaults)
          # We can just let the script handle defaults or set strictly if we knew them here.
          # For now, rely on defaults inside container or script if not set.

      - name: Create .env
        run: |
          cp .env.example .env
          # We don't need real API keys just to fetch public markets usually,
          # but Freqtrade might complain if exchange config is missing keys.
          # However, list-markets works with public data.
          # We'll set dummy keys if needed, or rely on empty.
          sed -i 's/DELTA_API_KEY=.*/DELTA_API_KEY=dummy_key/' .env
          sed -i 's/DELTA_API_SECRET=.*/DELTA_API_SECRET=dummy_secret/' .env

      - name: Run Markets Update
        run: |
          # Make scripts executable
          chmod +x scripts/*.sh tools/*.py

          # Run the update script
          # We need docker compose. GitHub Actions has it.
          # We need to ensure we can run it.
          # The script uses 'docker compose run' which pulls the image.
          ./scripts/update_markets_and_whitelist.sh

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain user_data/pairlists) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update delta markets and whitelist"
          title: "chore: Delta Markets Refresh $(date +'%Y-%m-%d')"
          body: |
            Automated market data refresh for Delta Exchange.

            - Environment: ${{ env.DELTA_ENV }}
            - Filter Mode: ${{ env.FILTER_MODE }}

            See artifacts for validation reports.
          branch: "chore/delta-markets-refresh"
          base: "main"
          delete-branch: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-reports
          path: user_data/reports/
