name: Delta Markets Refresh

on:
  schedule:
    # 06:30 IST = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      delta_env:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      filter_mode:
        description: 'Filter Mode'
        required: true
        default: 'perps_usdt'
        type: choice
        options:
        - perps_usdt
        - all_futures
        - allowlist_regex

jobs:
  refresh:
    runs_on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ccxt

    - name: Run Markets Refresh
      env:
        DELTA_ENV: ${{ github.event.inputs.delta_env || 'india_prod' }}
        FILTER_MODE: ${{ github.event.inputs.filter_mode || 'perps_usdt' }}
        DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
        DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        # Default strictness
        MIN_MARKETS: 20
        MAX_REMOVAL_RATIO: 0.25
        # Optional: strictly check volume
        STRICT_VOLUME: false
      run: |
        chmod +x scripts/*.sh
        # Create directories if needed
        ./scripts/bootstrap.sh
        # Run update
        ./scripts/update_markets_and_whitelist.sh

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: delta-markets-reports
        path: |
          user_data/reports/
          user_data/pairlists/

    - name: Create Pull Request
      # Only runs if there are changes
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(markets): update delta whitelist"
        title: "chore(markets): update delta whitelist"
        body: |
          Automated update of Delta markets and whitelist.

          Environment: ${{ env.DELTA_ENV }}
          Filter Mode: ${{ env.FILTER_MODE }}

          See artifacts for detailed reports.
        branch: chore/delta-markets-update
        base: main
        delete-branch: true
