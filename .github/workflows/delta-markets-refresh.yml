name: Delta Markets Refresh

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 06:30 IST
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment'
        required: true
        default: 'global_prod'
        type: choice
        options:
        - global_prod
        - india_prod
      FILTER_MODE:
        description: 'Whitelist Filter Mode'
        required: false
        default: 'perps_usdt'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create .env
        run: |
          echo "DELTA_ENV=${{ inputs.DELTA_ENV || 'global_prod' }}" >> .env
          echo "FILTER_MODE=${{ inputs.FILTER_MODE || 'perps_usdt' }}" >> .env
          # We use empty secrets for safety if not provided, but the script needs them if connecting
          # However, list-markets might work without API keys for public data?
          # Delta usually requires keys for some endpoints or just better limits.
          # If keys are needed, they must be in repo secrets.
          echo "DELTA_API_KEY=${{ secrets.DELTA_API_KEY }}" >> .env
          echo "DELTA_API_SECRET=${{ secrets.DELTA_API_SECRET }}" >> .env
          echo "MIN_MARKETS=20" >> .env
          echo "MAX_REMOVAL_RATIO=0.25" >> .env
          # Use dryrun config
          echo "FREQTRADE_CONFIG_FILE=config.delta.dryrun.json" >> .env

      - name: Pull Docker Image
        run: docker compose pull freqtrade

      - name: Update Markets and Whitelist
        run: |
          chmod +x scripts/update_markets_and_whitelist.sh
          chmod +x scripts/common.sh
          ./scripts/update_markets_and_whitelist.sh

      - name: Archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-reports
          path: user_data/reports/

      - name: Commit changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Force add in case of .gitignore issues (though reports might be ignored)
          git add -f user_data/pairlists/

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to whitelist."
          else
            TIMESTAMP=$(date +%Y-%m-%d)
            BRANCH_NAME="chore/delta-markets-${TIMESTAMP}"

            # We check if branch exists or just commit to a new one
            # Ideally we open a PR.
            git checkout -b $BRANCH_NAME
            git commit -m "chore: update markets and whitelist $TIMESTAMP"
            git push origin $BRANCH_NAME

            # Create PR using gh cli (pre-installed)
            # We need GITHUB_TOKEN
            gh pr create --title "chore: Delta Markets Update $TIMESTAMP" --body "Automated update of markets and whitelist." --head $BRANCH_NAME --base main || echo "PR creation failed or already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
