name: Delta Markets Refresh

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 06:30 IST
  workflow_dispatch:
    inputs:
      delta_env:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
      filter_mode:
        description: 'Filter Mode'
        required: true
        default: 'perps_usdt'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas ccxt
          pip install freqtrade

      - name: Run Market Update
        env:
          DELTA_ENV: ${{ github.event.inputs.delta_env || 'india_prod' }}
          FILTER_MODE: ${{ github.event.inputs.filter_mode || 'perps_usdt' }}
          # Secrets are usually not needed for public market data, but if so:
          # DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          # DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        run: |
          chmod +x scripts/update_markets_and_whitelist.sh
          ./scripts/update_markets_and_whitelist.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update delta markets and whitelist"
          title: "chore: Update Delta Markets & Whitelist"
          body: |
            Automated market refresh.

            Check the attached report for details.
          branch: chore/delta-markets-refresh
          base: main
          delete-branch: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: market-reports
          path: user_data/reports/
