name: Delta Markets Refresh

on:
  schedule:
    - cron: '0 1 * * *' # 06:30 Indian Standard Time is 01:00 UTC
  workflow_dispatch:
    inputs:
      DELTA_ENV:
        description: 'Delta Environment (india_prod, global_prod, india_testnet)'
        required: true
        default: 'india_prod'
      FILTER_MODE:
        description: 'Filter Mode (perps_usdt, all_futures, allowlist_regex)'
        required: true
        default: 'perps_usdt'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    env:
      DELTA_ENV: ${{ inputs.DELTA_ENV || 'india_prod' }}
      FILTER_MODE: ${{ inputs.FILTER_MODE || 'perps_usdt' }}
      DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
      DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: '3.11'

    - name: Create .env
      run: |
        echo "DELTA_ENV=${DELTA_ENV}" > .env
        echo "FILTER_MODE=${FILTER_MODE}" >> .env
        if [ -n "${DELTA_API_KEY}" ]; then
          echo "DELTA_API_KEY=${DELTA_API_KEY}" >> .env
          echo "DELTA_API_SECRET=${DELTA_API_SECRET}" >> .env
        fi
        echo "MIN_MARKETS=20" >> .env
        echo "MAX_REMOVAL_RATIO=0.25" >> .env

    - name: Run Market Refresh
      run: |
        # Ensure scripts are executable
        chmod +x scripts/*.sh

        # Pull image to ensure latest
        docker pull freqtradeorg/freqtrade:stable

        # Run update script
        ./scripts/update_markets_and_whitelist.sh

    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s user_data/pairlists/) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.check_changes.outputs.changes == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Configure auth since persist-credentials is false
        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}

        BRANCH_NAME="chore/delta-markets-$(date +'%Y-%m-%d')"
        git checkout -b $BRANCH_NAME

        git add user_data/pairlists/whitelist.delta.*

        git commit -m "chore: update delta markets whitelist $(date +'%Y-%m-%d')"

        git push origin $BRANCH_NAME --force

        gh pr create --title "chore: update delta markets $(date +'%Y-%m-%d')" \
          --body "Automated market refresh. \n\nSee artifacts for details." \
          --base main \
          --head $BRANCH_NAME || echo "PR already exists"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: market-reports
        path: |
          user_data/reports/markets_*.json
          user_data/reports/markets_schema_report_*.md
          user_data/reports/whitelist_diff_*.md
