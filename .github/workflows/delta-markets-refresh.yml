name: Delta Markets Refresh

on:
  schedule:
    # 06:30 Asia/Kolkata = 01:00 UTC
    - cron: '00 01 * * *'
  workflow_dispatch:
    inputs:
      delta_env:
        description: 'Delta Environment'
        required: true
        default: 'india_prod'
        type: choice
        options:
        - india_prod
        - global_prod
        - india_testnet
      filter_mode:
        description: 'Filter Mode'
        required: true
        default: 'perps_usdt'
        type: choice
        options:
        - perps_usdt
        - all_futures
        - allowlist_regex

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create .env
        run: |
          echo "DELTA_ENV=${{ inputs.delta_env || 'india_prod' }}" >> .env
          echo "DELTA_API_KEY=${{ secrets.DELTA_API_KEY }}" >> .env
          echo "DELTA_API_SECRET=${{ secrets.DELTA_API_SECRET }}" >> .env
          echo "FILTER_MODE=${{ inputs.filter_mode || 'perps_usdt' }}" >> .env
          echo "MIN_MARKETS=20" >> .env
          echo "MAX_REMOVAL_RATIO=0.25" >> .env
          echo "STRICT_VOLUME=false" >> .env

      - name: Setup Docker
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Pull Freqtrade Image
        run: docker compose pull freqtrade

      - name: Run Market Refresh
        run: |
          chmod +x scripts/*.sh
          ./scripts/update_markets_and_whitelist.sh

      - name: Upload Reports
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: market-reports
          path: |
            user_data/reports/*.json
            user_data/reports/*.md
            user_data/pairlists/*.json
            user_data/pairlists/*.txt

      - name: Check for Changes
        id: git-check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add user_data/pairlists/whitelist.delta.json
          git add user_data/pairlists/whitelist.delta.txt
          # We might not want to commit the diff report if we upload it as artifact
          # But the prompt says "generate drift report ... keep only last 7 dumps committed (or commit none and upload artifacts; but keep whitelist + diff committed)"
          git add user_data/reports/whitelist_diff_*.md
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update delta whitelist ${{ inputs.delta_env || 'india_prod' }}"
          title: "chore: Update Delta Whitelist (${{ inputs.delta_env || 'india_prod' }})"
          body: |
            Automated whitelist update.
            Environment: ${{ inputs.delta_env || 'india_prod' }}
            See attached reports for details.
          branch: "chore/delta-markets-refresh"
          delete-branch: true
